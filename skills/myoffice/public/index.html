<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agents Office</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🪑</text></svg>">
<style>
  :root {
    --bg: #f6f6f3;
    --panel: #ffffff;
    --ink: #1c1c1a;
    --muted: #6d6d68;
    --faint: #a3a39d;
    --line: #e4e3dd;
    --thinking: #7c5cdb;
    --tool: #2f7dd1;
    --typing: #1f9d6b;
    --waiting: #d98a0b;
    --done: #5b8a4a;
    --error: #d1453b;
    --idle: #a3a39d;
    --alert: #c2418f;
    --claude: #c96442;
    --codex: #10a37f;
    --gemini: #4f7cf0;
    --opencode: #5a5858;
    --shadow: 0 1px 2px rgba(0,0,0,.04), 0 4px 16px rgba(0,0,0,.04);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141413;
      --panel: #1e1e1c;
      --ink: #ecebe6;
      --muted: #a09f99;
      --faint: #6b6a65;
      --line: #2e2d2a;
      --thinking: #a48bf0;
      --tool: #5ea4ee;
      --typing: #3fc48f;
      --waiting: #f0a93a;
      --done: #86b872;
      --error: #f0675d;
      --idle: #6b6a65;
      --alert: #e46cb3;
      --shadow: none;
    }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); }
  body {
    font: 14px/1.45 ui-sans-serif, -apple-system, "Segoe UI", "PingFang TC", "Noto Sans TC", sans-serif;
    padding: 24px 16px 64px;
  }
  .wrap { max-width: 1180px; margin: 0 auto; }
  header { position: relative; display: flex; flex-wrap: wrap; align-items: center; gap: 12px 18px; margin-bottom: 16px; }
  .summary { display: flex; gap: 18px; flex-wrap: wrap; margin-left: auto; }
  .chip { display: inline-flex; align-items: center; gap: 6px; padding: 0; font-size: 12px; color: var(--muted); }
  .chip b { color: var(--ink); font-weight: 600; }
  /* Each count doubles as a show/hide switch for that status group. */
  button.chip { border: 0; background: none; font: inherit; font-size: 12px; cursor: pointer; border-radius: 6px; padding: 2px 4px; margin: -2px -4px; }
  button.chip:hover { background: var(--line); }
  button.chip[aria-pressed="false"] { opacity: .45; }
  button.chip[aria-pressed="false"] .dot { background: none; box-shadow: inset 0 0 0 1.5px currentColor; }
  button.chip[aria-pressed="false"] b { text-decoration: line-through; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: currentColor; flex: none; }
  .controls { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .seg { display: inline-flex; gap: 2px; padding: 3px; border: 1px solid var(--line); border-radius: 9px; background: var(--panel); }
  .seg button { border: 0; background: none; color: var(--muted); padding: 5px 12px; border-radius: 5px; font: inherit; font-size: 12.5px; cursor: pointer; }
  .seg button:hover:not(.on) { color: var(--ink); background: var(--bg); }
  .seg button.on { background: var(--ink); color: var(--bg); }
  .seg button small { opacity: .65; font-size: 11px; }
  label.tog { display: inline-flex; align-items: center; gap: 5px; font-size: 12.5px; color: var(--muted); cursor: pointer; user-select: none; }
  .btn { border: 1px solid var(--line); background: var(--panel); color: var(--muted); padding: 5px 11px; border-radius: 8px; font: inherit; font-size: 12.5px; cursor: pointer; }
  .btn:hover { color: var(--ink); border-color: var(--faint); }
  button:focus-visible, select:focus-visible, summary:focus-visible, input:focus-visible { outline: 2px solid var(--tool); outline-offset: 3px; }
  .controls > .btn, .settings > summary { min-height: 36px; display: inline-flex; align-items: center; white-space: nowrap; }
  .settings > summary { list-style: none; gap: 7px; color: var(--ink); }
  .settings > summary::-webkit-details-marker { display: none; }
  .settings > summary::after { content: "⌄"; color: var(--muted); }
  .settings[open] > summary { background: var(--line); }
  .settings[open] > summary::after { content: "⌃"; }
  .filter-active { font-size: 11px; color: var(--tool); }
  .settings-panel { position: absolute; z-index: 20; right: 0; top: calc(100% + 10px); width: min(360px, calc(100vw - 32px)); max-height: calc(100dvh - 180px); overflow-y: auto; overscroll-behavior: contain; padding: 18px; border: 1px solid var(--line); border-radius: 12px; background: var(--panel); box-shadow: 0 12px 40px #0003; }
  .setting-group + .setting-group { margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--line); }
  .setting-label { display: block; color: var(--muted); font-size: 12px; margin-bottom: 9px; }
  #officeGroup[hidden] + .setting-group { margin-top: 0; padding-top: 0; border-top: 0; }
  #qualSeg { display: flex; }
  #qualSeg button { flex: 1; }
  .setting-toggles { display: grid; gap: 12px; margin-top: 14px; }
  .setting-toggles .tog { color: var(--ink); gap: 8px; }
  .status-label { margin-top: 14px; margin-bottom: 0; }
  .status-toggles { grid-template-columns: 1fr 1fr; gap: 10px 12px; margin-top: 10px; }
  .status-toggles .dot { margin-right: -2px; }
  .tog input { accent-color: var(--tool); margin: 0; width: 15px; height: 15px; }
  .setting-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .setting-row .setting-label { margin: 0; }
  #langSel { max-width: 70%; }
  #notify { width: 100%; margin-top: 14px; padding: 8px; }
  #notify:disabled { cursor: default; opacity: .65; }
  @media (max-width: 640px) {
    header { gap: 14px; }
    .summary { margin-left: 0; width: 100%; gap: 18px; }
    .controls { gap: 6px; }
    .seg button { padding-inline: 9px; }
    .controls > .btn, .settings > summary { padding-inline: 9px; }
  }
  @media (max-width: 360px) {
    body { padding-inline: 10px; }
    .controls { gap: 4px; }
    .seg button { padding-inline: 7px; }
  }

  section { margin-top: 26px; }
  section h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 0 0 10px; font-weight: 600; display: flex; gap: 8px; align-items: center; }
  section h2 .n { color: var(--faint); font-weight: 500; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); gap: 12px; }
  @media (max-width: 520px) { .grid { grid-template-columns: 1fr; } .controls { margin-left: 0; } }

  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px 14px 12px; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 8px; min-width: 0; position: relative; transition: border-color .3s; }
  .card.sub { padding: 10px 12px; gap: 6px; }
  .card.flash { animation: flash 1.6s ease-out; }
  @keyframes flash { 0% { box-shadow: 0 0 0 3px var(--done); } 100% { box-shadow: var(--shadow); } }
  .card[data-s="waiting"], .card[data-s="error"] { border-color: color-mix(in srgb, var(--s) 55%, var(--line)); }
  .top { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .agent { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 600; letter-spacing: .02em; color: var(--muted); flex: none; }
  .agent-logo { width: 20px; height: 20px; object-fit: contain; padding: 1px; flex: none; }
  .platform, .kind { font-size: 11px; color: var(--muted); border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; flex: none; align-self: flex-start; }
  .tags { display: flex; flex-wrap: wrap; gap: 6px; }
  /* Warnings (near auto-compact, long turn): apart from the status colours. */
  .alert { font-size: 11px; color: var(--alert); border: 1px solid var(--alert); border-radius: 4px; padding: 0 5px; flex: none; align-self: flex-start; }
  .legend .alert-key { color: var(--alert); }
  .alert-chip { font: 700 10px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; color: #f4f4f0; background: #16181e; border: 1.5px solid var(--alert); border-radius: 4px; padding: 0 4px; }
  /* hover card only: the fields the compact card leaves out */
  .meta { display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; margin: 0; font-size: 11.5px; color: var(--muted); }
  .meta dt { color: var(--faint); white-space: nowrap; }
  .meta dd { margin: 0; min-width: 0; overflow-wrap: anywhere; font-variant-numeric: tabular-nums; }
  .meta .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; }
  #platformToggles .hair { width: 10px; height: 10px; border-radius: 50%; background: var(--hair, transparent); flex: none; }
  .project { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .time { margin-left: auto; color: var(--faint); font-size: 12px; font-variant-numeric: tabular-nums; white-space: nowrap; flex: none; }
  .title { color: var(--muted); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .status { display: flex; align-items: center; gap: 8px; color: var(--s); font-weight: 600; font-size: 13px; min-width: 0; }
  .status .lbl { white-space: nowrap; flex: none; }
  .status .act { flex: 1 1 auto; color: var(--ink); font-weight: 400; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; }
  .q, .r { font-size: 12.5px; color: var(--muted); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; word-break: break-word; }
  .q::before { content: "› "; color: var(--faint); }
  .r { color: var(--ink); opacity: .85; }
  .r::before { content: "← "; color: var(--faint); }
  .err { font-size: 12.5px; color: var(--error); }
  .foot { display: flex; gap: 8px; align-items: center; color: var(--faint); font-size: 11.5px; min-width: 0; }
  .foot .model { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .copy, .open { margin-left: auto; border: 0; background: none; color: var(--faint); font: inherit; font-size: 11.5px; cursor: pointer; padding: 0; flex: none; text-decoration: none; }
  .copy:hover, .open:hover { color: var(--ink); }
  .foot .copy ~ .copy, .foot .copy ~ .open { margin-left: 0; }

  [data-s="thinking"] { --s: var(--thinking); }
  [data-s="tool"] { --s: var(--tool); }
  [data-s="typing"] { --s: var(--typing); }
  [data-s="waiting"] { --s: var(--waiting); }
  [data-s="done"] { --s: var(--done); }
  [data-s="interrupted"] { --s: var(--idle); }
  [data-s="error"] { --s: var(--error); }
  [data-s="idle"] { --s: var(--idle); }

  .ind { width: 18px; height: 14px; display: inline-flex; align-items: center; justify-content: center; gap: 2px; flex: none; }
  .ind i { width: 4px; height: 4px; border-radius: 50%; background: var(--s); display: none; }
  [data-s="thinking"] .ind i { display: block; }
  [data-s="thinking"] .ind i { animation: bob 1.2s infinite ease-in-out; }
  [data-s="thinking"] .ind i:nth-child(2) { animation-delay: .15s; }
  [data-s="thinking"] .ind i:nth-child(3) { animation-delay: .3s; }
  @keyframes bob { 0%, 80%, 100% { opacity: .25; transform: translateY(0); } 40% { opacity: 1; transform: translateY(-3px); } }
  [data-s="tool"] .ind::before { content: ""; width: 11px; height: 11px; border: 2px solid var(--s); border-right-color: transparent; border-radius: 50%; animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  [data-s="typing"] .ind::before { content: ""; width: 2px; height: 13px; background: var(--s); animation: blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  [data-s="waiting"] .ind::before { content: ""; width: 9px; height: 9px; border-radius: 50%; background: var(--s); animation: pulse 1.4s infinite; }
  @keyframes pulse { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--s) 60%, transparent); } 100% { box-shadow: 0 0 0 8px transparent; } }
  [data-s="done"] .ind::before { content: "✓"; color: var(--s); font-weight: 700; }
  [data-s="error"] .ind::before { content: "!"; color: var(--s); font-weight: 800; }
  [data-s="interrupted"] .ind::before { content: "■"; color: var(--s); font-size: 9px; }
  [data-s="idle"] .ind::before { content: "–"; color: var(--s); }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }

  .office { position: relative; height: min(74vh, 820px); min-height: 380px; border: 1px solid var(--line); border-radius: 14px; overflow: hidden; background: var(--panel); }
  .office-canvas { display: block; }
  .office canvas { transition: opacity .35s; }
  .office.loading canvas { opacity: 0; }
  .office-loader { position: absolute; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 12px; color: var(--muted); font-size: 13px; z-index: 2; }
  .office.loading .office-loader { display: flex; }
  .office-loader .spin { width: 26px; height: 26px; border: 3px solid var(--line); border-top-color: var(--tool); border-radius: 50%; animation: spin .8s linear infinite; }
  .office-gl, .office-overlay { position: absolute; inset: 0; }
  .office-overlay { touch-action: none; }
  .tip { position: fixed; z-index: 10; width: 320px; max-width: calc(100vw - 24px); pointer-events: none; display: none; }
  .tip.pinned { pointer-events: auto; }
  .tip .card { box-shadow: 0 8px 30px rgba(0,0,0,.18); }
  .card.zone { gap: 6px; }
  .card.zone .zone-title { font-weight: 650; }
  .card.zone p { margin: 0; color: var(--muted); font-size: 13px; line-height: 1.5; }
  .legends { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 32px; margin-top: 10px; }
  .legend { display: flex; flex-wrap: wrap; gap: 6px 14px; color: var(--muted); font-size: 12px; }
  .legend span { display: inline-flex; align-items: center; gap: 5px; }

  .pip-preview { margin-bottom: 16px; padding: 12px; border: 1px solid var(--line); border-radius: 12px; background: var(--panel); }
  .pip-preview p { margin: 0 0 10px; color: var(--muted); }
  .pip-preview video { display: block; width: min(100%, 520px); margin-bottom: 10px; background: var(--panel); }
  .pip-error { color: var(--error); margin: 0 0 12px; }
  .newver { border: 1px solid var(--tool); background: color-mix(in srgb, var(--tool) 18%, var(--panel)); color: var(--ink); border-radius: 999px; padding: 4px 12px; font: inherit; font-size: 12.5px; cursor: pointer; animation: glowv 2.4s ease-in-out infinite; }
  .newver:disabled { opacity: .7; cursor: default; animation: none; }
  @keyframes glowv { 50% { box-shadow: 0 0 0 4px color-mix(in srgb, var(--tool) 25%, transparent); } }
  .ver { position: fixed; right: 14px; bottom: 12px; display: flex; gap: 10px; align-items: center; font-size: 12px; color: var(--faint); z-index: 5; }
  .ver button { border: 1px solid var(--tool); background: color-mix(in srgb, var(--tool) 14%, var(--panel)); color: var(--ink); border-radius: 999px; padding: 4px 12px; font: inherit; font-size: 12px; cursor: pointer; }
  .ver button:disabled { opacity: .6; cursor: default; }
  #ver { display: contents; }
  /* the running version shows above the button on hover or keyboard focus */
  .ver [data-ver] { position: relative; }
  .ver [data-ver]::after { content: attr(data-ver); position: absolute; left: 50%; bottom: calc(100% + 8px); transform: translateX(-50%); padding: 3px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); color: var(--muted); font-size: 11.5px; font-variant-numeric: tabular-nums; white-space: nowrap; box-shadow: var(--shadow); opacity: 0; pointer-events: none; transition: opacity .15s; }
  .ver [data-ver]:hover::after, .ver [data-ver]:focus-visible::after { opacity: 1; }
  .ver time { color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .empty { text-align: center; color: var(--muted); padding: 60px 16px; border: 1px dashed var(--line); border-radius: 12px; }
  .empty code { background: var(--panel); padding: 2px 6px; border-radius: 4px; }
  .conn { position: fixed; bottom: 14px; left: 50%; transform: translateX(-50%); background: var(--error); color: #fff; padding: 6px 14px; border-radius: 999px; font-size: 12.5px; display: none; }
  .conn.on { display: block; }

  /* The PiP iframe owns its animation clock, layout, and pointer events. */
  body.pip { padding: 8px; }
  body.pip .wrap { height: calc(100dvh - 16px); display: flex; flex-direction: column; }
  body.pip header { gap: 6px; margin-bottom: 8px; flex: none; }
  body.pip .newver, body.pip #legend, body.pip .ver,
  body.pip .controls > :not(#viewSeg) { display: none !important; }
  body.pip .controls { width: auto; padding: 0; border: 0; }
  body.pip .chip { padding: 2px 6px; font-size: 11px; }
  body.pip .summary { gap: 4px; width: auto; margin-left: 0; }
  body.pip #officeWrap { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  body.pip .office { flex: 1; height: auto; min-height: 120px; }
  body.pip #main { overflow: auto; min-height: 0; }
  body.pip #main:empty { display: none; }
  body.pip section { margin-top: 12px; }
  body.pip section:first-child { margin-top: 0; }
  body.pip .grid { grid-template-columns: 1fr; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="controls">
      <div class="seg" id="viewSeg">
        <button data-v="office" data-t="office"></button>
        <button data-v="list" data-t="list"></button>
      </div>
      <button class="btn" id="pipBtn" hidden></button>
      <details class="settings" id="settingsMenu">
        <summary class="btn" aria-controls="settingsPanel"><span data-t="settings"></span><span class="filter-active" id="activeFilter" hidden></span></summary>
        <div class="settings-panel" id="settingsPanel">
          <div class="setting-group" id="officeGroup">
            <span class="setting-label" id="qualLabel" data-t="officeView"></span>
            <div class="seg" id="qualSeg" role="group" aria-labelledby="qualLabel">
              <button data-v="mid" data-t="qMid"></button>
              <button data-v="high" data-t="qHigh"></button>
            </div>
          </div>
          <div class="setting-group">
            <span class="setting-label" id="filterLabel" data-t="agents"></span>
            <div class="setting-toggles status-toggles" id="agentToggles" role="group" aria-labelledby="filterLabel">
              <label class="tog"><input type="checkbox" data-v="claude"> <img class="agent-logo" src="/assets/agents/claude.png" alt="">Claude</label>
              <label class="tog"><input type="checkbox" data-v="codex"> <img class="agent-logo" src="/assets/agents/codex.png" alt="">Codex</label>
              <label class="tog"><input type="checkbox" data-v="gemini"> <img class="agent-logo" src="/assets/agents/gemini.png" alt="">Gemini</label>
              <label class="tog"><input type="checkbox" data-v="opencode"> <img class="agent-logo" src="/assets/agents/opencode.png" alt="">OpenCode</label>
            </div>
            <span class="setting-label status-label" id="platformLabel" data-t="platform"></span>
            <div class="setting-toggles status-toggles" id="platformToggles" role="group" aria-labelledby="platformLabel">
              <label class="tog"><input type="checkbox" data-v="vscode"> <i class="hair" data-hair="vscode"></i>VS Code</label>
              <label class="tog"><input type="checkbox" data-v="cli"> <i class="hair" data-hair="cli"></i>CLI</label>
              <label class="tog"><input type="checkbox" data-v="other"> <span data-t="other"></span></label>
            </div>
            <span class="setting-label status-label" id="statusLabel" data-t="showStatuses"></span>
            <div class="setting-toggles status-toggles" id="statusToggles" role="group" aria-labelledby="statusLabel">
              <label class="tog"><input type="checkbox" data-g="needsYou"> <span class="dot" style="color:var(--waiting)"></span><span data-t="needsYou"></span></label>
              <label class="tog"><input type="checkbox" data-g="error"> <span class="dot" style="color:var(--error)"></span><span data-t="error"></span></label>
              <label class="tog"><input type="checkbox" data-g="working"> <span class="dot" style="color:var(--tool)"></span><span data-t="working"></span></label>
              <label class="tog"><input type="checkbox" data-g="finished"> <span class="dot" style="color:var(--done)"></span><span data-t="finished"></span></label>
              <label class="tog"><input type="checkbox" data-g="idle" id="showIdle"> <span class="dot" style="color:var(--idle)"></span><span data-t="idle"></span></label>
            </div>
            <div class="setting-toggles">
              <label class="tog"><input type="checkbox" id="showSub"> <span data-t="subagents"></span></label>
              <label class="tog" id="agentBadgeToggle"><input type="checkbox" id="showAgent"> <span data-t="showAgent"></span></label>
            </div>
          </div>
          <div class="setting-group">
            <div class="setting-row">
              <label class="setting-label" for="langSel" data-t="language"></label>
              <select class="btn" id="langSel"></select>
            </div>
            <button class="btn" id="notify" data-t="notify"></button>
          </div>
        </div>
      </details>
      <button class="btn" id="refreshOffice" data-t="refreshOffice"></button>
    </div>
    <button class="newver" id="newVer" hidden></button>
    <div class="summary" id="summary"></div>
  </header>
  <p class="pip-error" id="pipError" role="alert" hidden></p>
  <div class="pip-preview" id="pipPreview" hidden>
    <p data-t="pipVideoHint"></p>
    <video id="pipVideo" controls autoplay muted playsinline aria-label="Office video preview"></video>
    <button class="btn" id="videoPipBtn" data-t="pip" hidden></button>
    <button class="btn" id="closePreview" data-t="pipStop"></button>
  </div>
  <div id="officeWrap">
    <div class="office loading" id="office"><div class="office-loader"><div class="spin"></div><span id="loaderText"></span></div></div>
    <div class="legends">
      <div class="legend" id="legend"></div>
      <div class="legend" id="agentLegend"></div>
    </div>
  </div>
  <main id="main"></main>
</div>
<div class="conn" id="conn" data-t="disconnected"></div>
<div class="tip" id="tip"></div>
<div class="ver"><span id="ver"></span><time id="clock"></time></div>
<script src="/i18n.js"></script>
<script src="/office.js"></script>
<script src="/popout.js"></script>

<script>
// Language: your pick in the 🌐 menu, else the language of your prompts
// (the server guesses it), else the browser's, else English.
let L = I18N.en;
let langCode = 'en';
let rtf = new Intl.RelativeTimeFormat('en', { numeric: 'auto', style: 'short' });
let clockFmt = new Intl.DateTimeFormat('en', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
function chooseLang(serverGuess) {
  const pick = store.get('lang', 'auto');
  if (pick !== 'auto' && I18N[pick]) return pick;
  if (serverGuess && I18N[serverGuess]) return serverGuess;
  return i18nFromBrowser(navigator.languages || [navigator.language]) || 'en';
}
function applyLang(code) {
  if (code === langCode && L === I18N[code] && document.documentElement.dataset.localized) return;
  document.documentElement.dataset.localized = 'true';
  langCode = code;
  L = I18N[code];
  document.documentElement.lang = L.html;
  rtf = new Intl.RelativeTimeFormat(L.html, { numeric: 'auto', style: 'short' });
  clockFmt = new Intl.DateTimeFormat(L.html, { hour: '2-digit', minute: '2-digit', second: '2-digit' });
  if (typeof drawClock === 'function') drawClock();
  document.querySelectorAll('[data-t]').forEach((el) => (el.textContent = L[el.dataset.t]));
  const legend = document.getElementById('legend');
  if (legend) legend.innerHTML = ['thinking', 'tool', 'typing', 'waiting', 'done', 'error']
    .map((k) => `<span data-s="${k}"><span class="dot" style="color:var(--s)"></span>${L[k]}</span>`).join('')
    + ALERT_KEYS.map(([k, label]) => `<span class="alert-key"><span class="alert-chip">${esc(OFFICE_ALERT_TEXT(k))}</span> ${L[label]}</span>`).join('');
  const sel = document.getElementById('langSel');
  if (sel) sel.options[0].textContent = `🌐 ${L.auto}`;
  if (typeof office !== 'undefined' && office) office.offDutyLabel = L.wentHome;
  if (typeof syncControls === 'function') syncControls();
  if (typeof renderVersion === 'function') renderVersion();
}

const store = (() => {
  const fallback = new Map();
  const get = (k, d) => { try { const v = localStorage.getItem('wmad.' + k); return v == null ? d : JSON.parse(v); } catch { return fallback.has(k) ? fallback.get(k) : d; } };
  const set = (k, v) => { fallback.set(k, v); try { localStorage.setItem('wmad.' + k, JSON.stringify(v)); } catch {} };
  return { get, set };
})();

const PREF_DEFAULTS = { view: 'office', quality: 'high', showSub: false, showAgent: true, lang: 'auto',
  // Agents and platforms are multi-select; storing what is unchecked keeps a newly added agent visible.
  hiddenAgents: [], hiddenPlatforms: [],
  // One switch per status group (the counts in the header and the settings panel share them).
  showNeedsYou: true, showError: true, showWorking: true, showFinished: true, showIdle: false };
function validPreference(k, v) {
  if (!Object.hasOwn(PREF_DEFAULTS, k)) return false;
  if (typeof PREF_DEFAULTS[k] === 'boolean') return typeof v === 'boolean';
  if (k === 'view') return ['office', 'list'].includes(v);
  if (k === 'quality') return ['mid', 'high'].includes(v);
  if (k === 'hiddenAgents') return Array.isArray(v) && v.every((x) => Object.hasOwn(OFFICE_AGENT_BADGES, x));
  if (k === 'hiddenPlatforms') return Array.isArray(v) && v.every((x) => ['vscode', 'cli', 'other'].includes(x));
  if (k === 'lang') return v === 'auto' || Object.hasOwn(I18N, v);
  return typeof v === 'string' && /^[a-z0-9-]+$/.test(v);
}
function readPreferences() {
  return Object.fromEntries(Object.entries(PREF_DEFAULTS).map(([k, d]) => {
    const v = store.get(k, d);
    return [k, validPreference(k, v) ? v : d];
  }));
}
const PIP = new URLSearchParams(location.search).get('pip') === '1';
if (PIP) document.body.classList.add('pip');
// The main page shows the office with the list under it; only the small PiP
// window still switches between the two.
document.getElementById('viewSeg').hidden = !PIP;
const showsOffice = () => !PIP || state.view === 'office';
const showsList = () => !PIP || state.view === 'list';

// ?view=office&quality=high&lang=zh-TW sets the prefs.
{
  const q = new URLSearchParams(location.search);
  if (PIP) {
    try {
      for (const [k, v] of Object.entries(JSON.parse(q.get('prefs')) || {})) if (validPreference(k, v)) store.set(k, v);
    } catch { /* malformed preferences use the saved defaults */ }
  }
  for (const k of ['view', 'quality', 'lang']) if (validPreference(k, q.get(k))) store.set(k, q.get(k));
  if (location.search) history.replaceState(null, '', location.pathname + (PIP ? '?pip=1' : ''));
}

const state = {
  ...readPreferences(),
  data: { now: Date.now(), sessions: [] },
  skew: 0,
  prev: new Map(),
  flash: new Set(),
};
let popout = null;

const ACTIVE = new Set(['thinking', 'tool', 'typing']);
const AGENT_NAME = { claude: 'Claude', codex: 'Codex', gemini: 'Gemini', opencode: 'OpenCode' };
// Where the session runs (from the server) and what started its turn.
const PLATFORM_NAME = { vscode: 'VS Code', cli: 'CLI', sdk: 'SDK', desktop: 'Desktop' };
const PROMPT_ICON = { command: '⌨️', notification: '🔔' };
const PROMPT_KIND_KEY = { command: 'kindCommand', notification: 'kindNotification' };
// Warnings beside the status (server: config.go), in legend order.
const ALERT_KEYS = [['compact', 'alertCompact'], ['longTurn', 'alertLongTurn']];
const contextPct = (s) => Math.round((s.contextTokens / s.compactAt) * 100);
const kTokens = (n) => `${Math.round(n / 1000)}k`;
const onAgent = (s) => !state.hiddenAgents.includes(s.agent);
function onPlatform(s) {
  const p = s.platform === 'vscode' || s.platform === 'cli' ? s.platform : 'other';
  return !state.hiddenPlatforms.includes(p);
}
// Header counts, list sections and the show/hide switches all follow this order.
const GROUPS = [
  { key: 'needsYou', show: 'showNeedsYou', color: 'var(--waiting)', match: (s) => s === 'waiting' },
  { key: 'error', show: 'showError', color: 'var(--error)', match: (s) => s === 'error' },
  { key: 'working', show: 'showWorking', color: 'var(--tool)', match: (s) => ACTIVE.has(s) },
  { key: 'finished', show: 'showFinished', color: 'var(--done)', match: (s) => s === 'done' || s === 'interrupted' },
  { key: 'idle', show: 'showIdle', color: 'var(--idle)', match: (s) => s === 'idle' },
];
const groupOf = (status) => GROUPS.find((g) => g.match(status));
const statusShown = (status) => { const g = groupOf(status); return !g || state[g.show]; };

function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

function dur(ms) {
  const s = Math.max(0, Math.floor(ms / 1000));
  if (s < 60) return `${s}s`;
  const m = Math.floor(s / 60);
  if (m < 60) return `${m}m ${String(s % 60).padStart(2, '0')}s`;
  const h = Math.floor(m / 60);
  return `${h}h ${String(m % 60).padStart(2, '0')}m`;
}

function ago(t, now) {
  const s = Math.round((t - now) / 1000);
  if (s > -45) return rtf.format(0, 'second');
  const m = Math.round(s / 60);
  if (m > -60) return rtf.format(m, 'minute');
  const h = Math.round(m / 60);
  if (h > -24) return rtf.format(h, 'hour');
  return rtf.format(Math.round(h / 24), 'day');
}

function timeLabel(s, now) {
  // turnStartApprox: a big log whose tail holds no prompt, so the turn is at least this old.
  if ((ACTIVE.has(s.status) || s.status === 'waiting') && s.turnStartedAt) return (s.turnStartApprox ? '≥ ' : '') + dur(now - s.turnStartedAt);
  return s.lastEventAt ? ago(s.lastEventAt, now) : '';
}

// Single-quote for POSIX shells: inside '…' nothing ($(), backticks, $VAR)
// is expanded, so a folder or session name can't run anything when pasted.
const shq = (v) => `'${String(v).replace(/'/g, `'\\''`)}'`;
function resumeCmd(s) {
  const cd = s.cwd ? `cd ${shq(s.cwd)} && ` : '';
  if (s.agent === 'claude') return `${cd}claude --resume ${shq(s.id)}`;
  if (s.agent === 'gemini' && s.tool === 'agy') return `${cd}agy --conversation ${shq(s.id)}`;
  if (s.agent === 'gemini') return `${cd}gemini --resume ${shq(s.sessionId || s.id)}`;
  if (s.agent === 'opencode') return `${cd}opencode --session ${shq(s.id)}`;
  return `${cd}codex resume ${shq(s.id)}`;
}

// Deep links the VS Code extensions register. Claude Code: reveals the
// session's tab if it is open, otherwise resumes it. Codex: opens the sidebar
// and navigates its webview to the local thread. Only sessions started from
// VS Code have a tab to go to.
function vscodeLink(s) {
  if (s.platform !== 'vscode' || s.subagent) return '';
  let href = '';
  if (s.agent === 'claude') href = `vscode://anthropic.claude-code/open?session=${encodeURIComponent(s.id)}`;
  else if (s.agent === 'codex') href = `vscode://openai.chatgpt/local/${encodeURIComponent(s.id)}`;
  if (!href) return '';
  return `<a class="open" href="${href}">${L.openVscode}</a>`;
}

function agentLogo(agent) {
  const badge = OFFICE_AGENT_BADGES[agent];
  return badge ? `<img class="agent-logo" src="${badge.logo}" alt="" aria-hidden="true">` : '';
}

// The platform and what started the turn, as small tags under the title row.
function tags(s) {
  const platform = s.platform ? `<span class="platform">${esc(PLATFORM_NAME[s.platform] || s.platform)}</span>` : '';
  const kind = PROMPT_ICON[s.promptKind] ? `<span class="kind">${PROMPT_ICON[s.promptKind]} ${esc(L[PROMPT_KIND_KEY[s.promptKind]])}</span>` : '';
  const alerts = ALERT_KEYS.filter(([k]) => (s.alerts || []).includes(k))
    .map(([k, label]) => `<span class="alert" data-a="${k}"><span class="alert-chip">${esc(OFFICE_ALERT_TEXT(k, s))}</span> ${esc(L[label])}</span>`).join('');
  return platform || kind || alerts ? `<div class="tags">${platform}${kind}${alerts}</div>` : '';
}

// Everything the server sends that the compact card has no room for; shown
// only in the office hover card (`detail`).
function meta(s, now) {
  const rows = [];
  if (s.cwd) rows.push([L.cwd, s.cwd, 'mono']);
  // The IDE's session list is per workspace folder, which the shell may have
  // `cd`-ed away from; only worth a row when the two differ.
  if (s.workspace && s.workspace !== s.cwd) rows.push([L.workspace, s.workspace, 'mono']);
  if (s.startedAt) rows.push([L.started, ago(s.startedAt, now)]);
  if (s.lastEventAt) rows.push([L.lastEvent, ago(s.lastEventAt, now)]);
  if (s.contextTokens) rows.push([L.context, s.compactAt ? `${contextPct(s)}% (${kTokens(s.contextTokens)} / ${kTokens(s.compactAt)})` : kTokens(s.contextTokens)]);
  rows.push([L.sessionId, s.sessionId || s.id, 'mono']);
  if (s.parentId) rows.push([L.parentId, s.parentId, 'mono']);
  return `<dl class="meta">${rows.map(([k, v, c]) => `<dt>${esc(k)}</dt><dd${c ? ` class="${c}"` : ''}>${esc(v)}</dd>`).join('')}</dl>`;
}

function card(s, now, detail = false) {
  const project = s.project || (s.cwd ? s.cwd : '—');
  const title = s.title && s.title !== project ? `<div class="title" title="${esc(s.title)}">${esc(s.title)}</div>` : '';
  const act = s.activity ? `<span class="act" title="${esc(s.activity)}">${esc(s.activity)}</span>` : '';
  const showText = !s.subagent || ACTIVE.has(s.status);
  const q = showText && s.prompt ? `<div class="q" title="${esc(s.prompt)}">${esc(s.prompt)}</div>` : '';
  // The server clears the reply when a turn starts, so mid-turn it is what the
  // agent has written so far; only the office card has room for it.
  const r = showText && s.reply && (detail || !ACTIVE.has(s.status)) ? `<div class="r" title="${esc(s.reply)}">${esc(s.reply)}</div>` : '';
  const err = s.error ? `<div class="err">${esc(s.error)}</div>` : '';
  const sub = s.subagent ? ` · ${L.sub}` : '';
  return `
  <div class="card${s.subagent ? ' sub' : ''}${state.flash.has(s.key) ? ' flash' : ''}" data-s="${s.status}" data-key="${esc(s.key)}">
    <div class="top">
      <span class="agent ${esc(s.agent)}">${agentLogo(s.agent)}${esc(AGENT_NAME[s.agent] || s.agent)}</span>
      <span class="project" title="${esc(s.cwd)}">${esc(project)}</span>
      <span class="time" data-time="${esc(s.key)}">${esc(timeLabel(s, now))}</span>
    </div>
    ${tags(s)}
    ${title}
    <div class="status"><span class="ind"><i></i><i></i><i></i></span><span class="lbl">${esc(L[s.status] || s.status)}</span>${act}</div>
    ${err}${q}${r}
    ${detail ? meta(s, now) : ''}
    <div class="foot"><span class="model">${esc((s.model || '') + sub)}</span><button class="copy" data-copy="${esc(resumeCmd(s))}">${L.copy}</button>${s.title ? `<button class="copy" data-copy="${esc(s.title)}">${L.copyTitle}</button>` : ''}${vscodeLink(s)}</div>
  </div>`;
}

function visible() {
  return state.data.sessions.filter((s) =>
    onAgent(s) && onPlatform(s) &&
    (state.showSub || !s.subagent) &&
    statusShown(s.status));
}

function render() {
  const now = Date.now() - state.skew;
  const list = visible();
  const all = state.data.sessions.filter((s) => onAgent(s) && onPlatform(s) && (state.showSub || !s.subagent));

  const count = (f) => all.filter((s) => f(s.status)).length;
  // The counts always include hidden groups, so a switched-off group still shows how many it hides.
  document.getElementById('summary').innerHTML = GROUPS.map((g) => {
    const n = count(g.match);
    const on = !!state[g.show];
    return `<button class="chip" type="button" data-g="${g.key}" aria-pressed="${on}" title="${esc(L.showStatuses)}"><span class="dot" style="color:${g.color}"></span>${L[g.key]} <b>${n}</b></button>`;
  }).join('');

  const working = count((s) => ACTIVE.has(s));
  const needs = count((s) => s === 'waiting' || s === 'error');
  document.title = (needs ? `(${needs}!) ` : working ? `(${working}) ` : '') + L.title;

  const main = document.getElementById('main');
  const officeMode = showsOffice();
  document.getElementById('officeWrap').style.display = officeMode ? '' : 'none';
  // The office decides who sits at a desk and who wanders around; switched-off
  // status groups stay out of the room (and out of the off-duty count).
  const officeList = list;
  const poppedOut = !!popout?.win;
  // Wait for the first snapshot so people start at their places instead of
  // all walking in through the door.
  if (office && state.loaded) {
    office.showAgent = state.showAgent;
    office.setVisible(officeMode && !poppedOut);
    office.update(officeList);
  }
  if (poppedOut) {
    // The office lives in the PiP window; the main page keeps only the list.
    document.getElementById('officeWrap').style.display = 'none';
    hideTip();
  } else if (officeMode) {
    document.getElementById('officeWrap').style.display = officeList.length ? '' : 'none';
    refreshTip();
  }
  if (!showsList() || (officeMode && !poppedOut && !officeList.length)) {
    main.innerHTML = officeList.length ? '' : `<div class="empty">${esc(L.empty)}</div>`;
    return;
  }
  const groups = PIP ? GROUPS.slice(0, 3) : GROUPS;
  if (!list.some((s) => groups.some((g) => g.match(s.status)))) {
    main.innerHTML = `<div class="empty">${esc(PIP ? L.pipQuiet : L.empty)}</div>`;
    return;
  }
  main.innerHTML = groups.map((g) => {
    const items = list.filter((s) => g.match(s.status));
    if (!items.length) return '';
    return `<section><h2>${L[g.key]} <span class="n">${items.length}</span></h2><div class="grid">${items.map((s) => card(s, now)).join('')}</div></section>`;
  }).join('');
}

function tickTimes() {
  if (tipKey) refreshTip();
  const now = Date.now() - state.skew;
  const byKey = new Map(state.data.sessions.map((s) => [s.key, s]));
  document.querySelectorAll('[data-time]').forEach((el) => {
    const s = byKey.get(el.dataset.time);
    if (s) el.textContent = timeLabel(s, now);
  });
}

function onData(data) {
  state.skew = Date.now() - data.now;
  if (!clockFromWorker) clockOffset = -state.skew;
  const first = state.prev.size === 0;
  state.flash.clear();
  for (const s of data.sessions) {
    const before = state.prev.get(s.key);
    if (!first && before && ACTIVE.has(before) && (s.status === 'done' || s.status === 'waiting')) {
      state.flash.add(s.key);
      if (!PIP && !s.subagent && window.Notification && Notification.permission === 'granted') {
        try { new Notification(s.status === 'done' ? L.doneNote(s.project || s.agent) : `${s.project || s.agent}: ${L.waiting}`, { body: s.reply || s.activity || '', tag: s.key }); } catch {}
      }
    }
    state.prev.set(s.key, s.status);
  }
  state.data = data;
  state.loaded = true;
  applyLang(chooseLang(data.lang));
  render();
}

function connect() {
  const es = new EventSource('/events');
  const conn = document.getElementById('conn');
  es.onmessage = (e) => { conn.classList.remove('on'); onData(JSON.parse(e.data)); };
  es.onerror = () => conn.classList.add('on');
}

// Native disclosure keeps settings keyboard-accessible without a modal focus trap.
const settingsMenu = document.getElementById('settingsMenu');
document.addEventListener('click', (e) => {
  if (!settingsMenu.contains(e.target)) settingsMenu.open = false;
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && settingsMenu.open) {
    settingsMenu.open = false;
    settingsMenu.querySelector('summary').focus();
  }
});
settingsMenu.addEventListener('toggle', () => { if (settingsMenu.open) hideTip(); });

document.getElementById('qualSeg').addEventListener('click', (e) => {
  const b = e.target.closest('button'); if (!b) return;
  state.quality = b.dataset.v; store.set('quality', state.quality); hideTip(); syncControls(); makeOffice();
});
document.getElementById('viewSeg').addEventListener('click', (e) => {
  const b = e.target.closest('button'); if (!b) return;
  state.view = b.dataset.v; store.set('view', state.view); hideTip(); syncControls(); render();
});
for (const [id, key] of [['agentToggles', 'hiddenAgents'], ['platformToggles', 'hiddenPlatforms']]) {
  document.getElementById(id).addEventListener('change', (e) => {
    const c = e.target.closest('input[data-v]'); if (!c) return;
    state[key] = c.checked ? state[key].filter((v) => v !== c.dataset.v) : [...state[key], c.dataset.v];
    store.set(key, state[key]); syncControls(); render();
  });
}
document.querySelectorAll('#platformToggles .hair').forEach((el) => el.style.setProperty('--hair', OFFICE_PLATFORM_HAIR[el.dataset.hair][0]));
const showSub = document.getElementById('showSub');
const showAgent = document.getElementById('showAgent');
showSub.addEventListener('change', () => { state.showSub = showSub.checked; store.set('showSub', state.showSub); render(); });
showAgent.addEventListener('change', () => { state.showAgent = showAgent.checked; store.set('showAgent', state.showAgent); syncControls(); render(); });
// Status groups: the header counts and the settings checkboxes flip the same preference.
function setStatusShown(key, on) {
  const g = GROUPS.find((x) => x.key === key); if (!g) return;
  state[g.show] = on; store.set(g.show, on); syncControls(); render();
}
document.getElementById('summary').addEventListener('click', (e) => {
  const b = e.target.closest('button.chip'); if (!b) return;
  setStatusShown(b.dataset.g, b.getAttribute('aria-pressed') !== 'true');
});
document.getElementById('statusToggles').addEventListener('change', (e) => {
  const c = e.target.closest('input[data-g]'); if (!c) return;
  setStatusShown(c.dataset.g, c.checked);
});

const notifyBtn = document.getElementById('notify');
function syncControls() {
  document.querySelectorAll('#agentToggles input').forEach((c) => (c.checked = !state.hiddenAgents.includes(c.dataset.v)));
  document.querySelectorAll('#platformToggles input').forEach((c) => (c.checked = !state.hiddenPlatforms.includes(c.dataset.v)));
  document.querySelectorAll('#viewSeg button').forEach((b) => b.classList.toggle('on', b.dataset.v === state.view));
  document.querySelectorAll('#qualSeg button').forEach((b) => b.classList.toggle('on', b.dataset.v === state.quality));
  document.getElementById('officeGroup').hidden = !showsOffice();
  document.getElementById('refreshOffice').hidden = !showsOffice();
  // Next to "Settings": what is still checked, for whichever of the two filters is narrowed.
  const checked = (names, hidden) => (hidden.length ? Object.keys(names).filter((k) => !hidden.includes(k)).map((k) => names[k]).join('/') || '–' : '');
  const activeFilter = document.getElementById('activeFilter');
  activeFilter.hidden = !state.hiddenAgents.length && !state.hiddenPlatforms.length;
  activeFilter.textContent = [checked(AGENT_NAME, state.hiddenAgents), checked({ vscode: 'VS Code', cli: 'CLI', other: L.other }, state.hiddenPlatforms)].filter(Boolean).join(' · ');
  document.querySelectorAll('.seg button').forEach(b => b.setAttribute('aria-pressed', b.classList.contains('on')));
  showSub.checked = state.showSub;
  showAgent.checked = state.showAgent;
  document.querySelectorAll('#statusToggles input[data-g]').forEach((c) => { const g = GROUPS.find((x) => x.key === c.dataset.g); c.checked = !!(g && state[g.show]); });
  document.getElementById('agentBadgeToggle').style.display = showsOffice() ? '' : 'none';
  document.getElementById('agentLegend').hidden = !state.showAgent;
  popout?.sync(PIP, showsOffice() ? 'office' : 'list');
  if (!window.Notification) notifyBtn.style.display = 'none';
  else if (Notification.permission === 'granted') { notifyBtn.textContent = L.notifyOn; notifyBtn.disabled = true; }
}
notifyBtn.addEventListener('click', () => Notification.requestPermission().then(syncControls));

document.addEventListener('click', (e) => {
  const b = e.target.closest('[data-copy]'); if (!b) return;
  const label = b.textContent;
  navigator.clipboard?.writeText(b.dataset.copy).then(() => {
    b.textContent = L.copied; setTimeout(() => (b.textContent = label), 1400);
  });
});

// ---- office view
const tip = document.getElementById('tip');
let tipKey = null, tipPinned = false, tipAt = { x: 0, y: 0 };
function placeTip() {
  const r = tip.getBoundingClientRect();
  let x = tipAt.x + 16, y = tipAt.y + 16;
  if (x + r.width > innerWidth - 8) x = tipAt.x - r.width - 16;
  if (y + r.height > innerHeight - 8) y = Math.max(8, innerHeight - r.height - 8);
  tip.style.left = Math.max(8, x) + 'px';
  tip.style.top = y + 'px';
}
// Clicking a place in the office (boards, booth, TV, fridge) explains what the area is for.
const ZONE_TEXT = { whiteboard: 'zoneWhiteboard', booth: 'zoneBooth', tv: 'zoneTv', fridge: 'zoneFridge', meeting: 'zoneMeeting' };
function zoneCard(id) {
  const k = ZONE_TEXT[id];
  return `<div class="card zone"><div class="zone-title">${esc(L[k])}</div><p>${esc(L[k + 'Info'])}</p></div>`;
}
function refreshTip() {
  if (!tipKey) return;
  if (tipKey.startsWith('zone:')) { tip.innerHTML = zoneCard(tipKey.slice(5)); placeTip(); return; }
  const s = state.data.sessions.find((x) => x.key === tipKey);
  if (!s) return hideTip();
  tip.innerHTML = card(s, Date.now() - state.skew, true);
  placeTip();
}
function hideTip() { tipKey = null; tipPinned = false; tip.style.display = 'none'; tip.classList.remove('pinned'); }
const officeOpts = {
  compact: PIP,
  onFrame: (renderer) => popout?.drawPreview(renderer),
  label: (s) => (PROMPT_ICON[s.promptKind] ? PROMPT_ICON[s.promptKind] + ' ' : '') + (s.project || AGENT_NAME[s.agent] || s.agent),
  sublabel: (s) => (s.platform ? PLATFORM_NAME[s.platform] || s.platform : ''),
  onHover(s, at, click) {
    if (click) {
      if (!s) return hideTip();
      tipPinned = true; tip.classList.add('pinned');
    } else if (tipPinned) return;
    if (!s) { if (!tipPinned) hideTip(); return; }
    tipKey = s.key; tipAt = at;
    tip.style.display = 'block';
    refreshTip();
  },
  onZone(id, at) {
    if (!ZONE_TEXT[id]) return;
    tipPinned = true; tip.classList.add('pinned');
    tipKey = 'zone:' + id; tipAt = at;
    tip.style.display = 'block';
    refreshTip();
  },
};
let office = null;
let officeKind = null;
// The 3D office (three.js + models) is only fetched when someone picks it.
// Until the new office has drawn a settled frame, show a loader instead of a
// half-built scene.
const officeEl = document.getElementById('office');
function setLoading(on, text) {
  officeEl.classList.toggle('loading', on);
  if (text) document.getElementById('loaderText').textContent = text;
}
async function makeOffice() {
  const high = state.quality === 'high';
  const kind = high ? 'high' : 'mid';
  if (kind === officeKind) return;
  officeKind = kind;
  setLoading(true, high ? L.loading3d : L.loading2d);
  let Cls = window.Office;
  const opts = { ...officeOpts, showAgent: state.showAgent };
  if (high) {
    try {
      Cls = (await import('/office3d.js')).Office3D;
    } catch (e) { console.error(e); Cls = window.Office; }
    if (officeKind !== kind) return;
  }
  if (office) office.destroy();
  let mine;
  try {
    mine = new Cls(officeEl, opts);
  } catch (e) {
    console.error(e);
    mine = new window.Office(officeEl, officeOpts);
    if (high) { state.quality = 'mid'; store.set('quality', 'mid'); officeKind = 'mid'; syncControls(); }
  }
  office = mine;
  office.offDutyLabel = L.wentHome;
  render();
  const ok = await mine.ready;
  if (office !== mine) return;
  if (!ok && high) {
    // 3D failed (no WebGL, missing files…): fall back to the 2D office.
    setLoading(true, L.failed3d);
    state.quality = 'mid'; store.set('quality', 'mid'); syncControls();
    setTimeout(() => makeOffice(), 1200);
    return;
  }
  setLoading(false);
}
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') hideTip(); });
// Rebuilds only the office scene (camera, people, props); the page, the
// session stream and the settings stay as they are.
document.getElementById('refreshOffice').addEventListener('click', () => {
  hideTip(); officeKind = null; makeOffice();
});

// ---- version + one-click update
const verEl = document.getElementById('ver');
let verInfo = null;
function renderVersion() {
  if (!verInfo) return;
  // the running version is the hover tooltip (data-ver) of whatever is shown
  const ver = `v${esc(verInfo.version)}`;
  let html;
  if (verInfo.updateAvailable) {
    html = verInfo.canUpdate
      ? `<button id="updBtn" data-ver="${ver}">⬆ ${esc(L.update)} v${esc(verInfo.latest)}</button>`
      : `<span data-ver="${ver}">${esc(L.gitPull)} → v${esc(verInfo.latest)}</span>`;
  } else {
    html = `<button id="chkBtn" data-ver="${ver}" aria-describedby="verNote">${esc(L.checkUpdate)}</button>`;
  }
  verEl.innerHTML = html + `<span id="verNote" hidden>${ver}</span>`;
  // a second, more visible way in, next to the title
  const top = document.getElementById('newVer');
  top.hidden = !(verInfo.updateAvailable && verInfo.canUpdate);
  if (!top.hidden && !top.disabled) top.textContent = `⬆ ${L.newVersion} v${verInfo.latest}`;
  top.onclick = () => { const b2 = document.getElementById('updBtn'); if (b2) { top.disabled = true; top.textContent = L.updating; b2.click(); } };
  const b = document.getElementById('updBtn');
  if (b) b.onclick = async () => {
    b.disabled = true; b.textContent = L.updating;
    const r = await fetch('/api/update', { method: 'POST', headers: { 'x-whatsmyagentdoing': 'update' } }).then((x) => x.json()).catch(() => ({ ok: false }));
    if (!r.ok) { b.textContent = `${L.updateFailed}${r.error ? ': ' + r.error : ''}`; setTimeout(renderVersion, 4000); return; }
    b.textContent = L.updated;
    // the server restarts itself; reload once it answers again
    const t0 = Date.now();
    const wait = setInterval(() => {
      fetch('/api/version', { cache: 'no-store' }).then((x) => x.json()).then((v) => {
        if (v.version !== verInfo.version || Date.now() - t0 > 20000) { clearInterval(wait); location.reload(); }
      }).catch(() => {});
    }, 1000);
  };
  // checking is manual: nothing goes to GitHub until this button is pressed
  const c = document.getElementById('chkBtn');
  if (c) c.onclick = async () => {
    c.disabled = true;
    const v = await fetch('/api/version?check=1', { cache: 'no-store' }).then((x) => x.json()).catch(() => null);
    if (v) verInfo = v;
    if (verInfo.updateAvailable) { renderVersion(); return; }
    c.textContent = v && v.latest ? L.upToDate : L.checkFailed;
    setTimeout(renderVersion, 4000);
  };
}
let verTimer = null;
function loadVersion() {
  fetch('/api/version', { cache: 'no-store' }).then((r) => r.json()).then((v) => {
    verInfo = v; renderVersion();
    // AUTO_UPDATE_CHECK in src/config.js: the server already checked on this
    // request; keep asking every 30 minutes
    if (v.auto && !verTimer) verTimer = setInterval(loadVersion, 30 * 60 * 1000);
  }).catch(() => {});
}
loadVersion();

// ---- clock (bottom-right corner, next to the version button)
// Shows the host's time, not this device's: sw.js keeps one offset against
// /api/time (round trip halved) for every window and tab, so a device clock
// that is off, or a tab the browser throttled in the background, still shows
// what the dashboard's host says. Every tick recomputes from the absolute
// clock, so delayed timers never accumulate drift. Until the worker answers
// (or where there is none) the SSE snapshot's skew is used.
const clockEl = document.getElementById('clock');
let clockOffset = 0;
let clockFromWorker = false;
function drawClock() {
  const t = new Date(Date.now() + clockOffset);
  clockEl.dateTime = t.toISOString();
  clockEl.textContent = clockFmt.format(t);
}
function startClock() {
  if (PIP) return;
  const tick = () => { drawClock(); setTimeout(tick, 1000 - ((Date.now() + clockOffset) % 1000)); };
  tick();
  let ask = null;
  document.addEventListener('visibilitychange', () => { if (!document.hidden) { drawClock(); ask?.(); } });
  if (!('serviceWorker' in navigator)) return;
  navigator.serviceWorker.addEventListener('message', (e) => {
    if (e.data?.type !== 'time') return;
    clockOffset = e.data.offset; clockFromWorker = true; drawClock();
  });
  navigator.serviceWorker.register('/sw.js').then(() => navigator.serviceWorker.ready).then((reg) => {
    ask = () => reg.active?.postMessage({ type: 'time' });
    ask();
    setInterval(ask, 60 * 1000);
  }).catch(() => {});
}
startClock();

const langSel = document.getElementById('langSel');
langSel.innerHTML = '<option value="auto"></option>' +
  Object.entries(I18N).map(([k, v]) => `<option value="${k}">${v.langName}</option>`).join('');
langSel.value = store.get('lang', 'auto');
langSel.addEventListener('change', () => {
  store.set('lang', langSel.value);
  applyLang(chooseLang(state.data.lang));
  render();
});
document.getElementById('agentLegend').innerHTML = Object.entries(OFFICE_AGENT_BADGES)
  .map(([key, a]) => `<span>${agentLogo(key)}${a.label}</span>`).join('');
popout = new OfficePopout({
  preferences: () => ({ ...Object.fromEntries(Object.keys(PREF_DEFAULTS).map((k) => [k, state[k]])), lang: store.get('lang', 'auto') }),
  office: () => office,
  text: (key) => L[key],
  changed: () => { syncControls(); render(); },
});
// Both windows share preferences; keep filters, language, 2D/3D and badges in
// sync even when changes come from the compact window or another open tab.
window.addEventListener('storage', (e) => {
  if (e.key !== null && !Object.keys(PREF_DEFAULTS).some((k) => e.key === 'wmad.' + k)) return;
  Object.assign(state, readPreferences());
  langSel.value = state.lang;
  hideTip();
  applyLang(chooseLang(state.data.lang));
  syncControls();
  makeOffice();
  render();
});
applyLang(chooseLang(null));
syncControls();
makeOffice();
connect();
setInterval(tickTimes, 1000);
</script>
